<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacheca Messaggi</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div id="loginView" class="auth-screen">
            <h2>Login</h2>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPass" placeholder="Password">
            <button class="action-btn" onclick="login()">Accedi</button>
            <span class="link" onclick="showRegister()">Crea un account</span>
        </div>

        <div id="registerView" class="auth-screen hidden">
            <h2>Registrazione</h2>
            <input type="email" id="regEmail" placeholder="Email">
            <input type="password" id="regPass" placeholder="Password">
            <button class="action-btn" onclick="register()">Registrati</button>
            <span class="link" onclick="showLogin()">Hai già un account? Accedi</span>
        </div>

        <div id="boardView" class="hidden">
            <header>
                <h2 id="userHeader">Bacheca</h2>
                <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
            </header>
            <div id="messageList"></div>
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="Scrivi..." onkeypress="handleEnter(event)">
                <button class="send-btn" onclick="postMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
